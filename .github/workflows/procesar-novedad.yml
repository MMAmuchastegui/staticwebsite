name: Procesar Novedad

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  procesar:
    if: contains(github.event.issue.labels.*.name, 'novedad-evento')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Procesar issue y actualizar JSON
        id: procesar
        uses: actions/github-script@v7
        with:
          script: |
            const path = require('path');
            const { procesarNuevaNovedadEvento } = require(
              path.join(process.env.GITHUB_WORKSPACE, 'scripts', 'procesar-novedad.js')
            );
            try {
              const { id, title } = await procesarNuevaNovedadEvento(context.payload.issue.body);
              core.setOutput('novedad_id', id);
              core.setOutput('novedad_title', title);
              core.setOutput('success', 'true');
            } catch (err) {
              core.setOutput('success', 'false');
              core.setOutput('error_message', err.message);
            }

      - name: Commit y push
        if: steps.procesar.outputs.success == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "novedades: agregar evento ${{ steps.procesar.outputs.novedad_title }}"
          file_pattern: "lib/data/novedades-raw.json public/images/novedades"

      - name: Comentar éxito
        if: steps.procesar.outputs.success == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `✅ Novedad publicada: **${{ steps.procesar.outputs.novedad_title }}**`,
            });
            await github.rest.issues.update({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, state: 'closed',
              labels: ['novedad-evento', 'publicado'],
            });

      - name: Comentar error
        if: steps.procesar.outputs.success == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `❌ No se pudo procesar la novedad: ${{ steps.procesar.outputs.error_message }}`,
            });